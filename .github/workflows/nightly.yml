# Rolling "nightly" prerelease: rebuilt and replaced on every push to master.
name: nightly

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Test
        run: nix develop -c sh -c 'zig build test && zig build -Drelease=true -Dcpu=baseline && python3 tests/integration.py'

      - name: Build
        run: |
          mkdir dist
          for target in x86_64-linux aarch64-linux x86_64-macos aarch64-macos; do
            nix develop -c zig build -Drelease=true -Dcpu=baseline -Dtarget="$target" --prefix "out/$target"
            cp "out/$target/bin/direnv" "dist/direnv-$target"
          done
          (cd dist && sha256sum direnv-* > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* --prerelease --target "$GITHUB_SHA" --title nightly \
            --notes "Unversioned build of $GITHUB_SHA. Replaced on every push to master."
